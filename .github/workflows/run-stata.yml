name: Run Stata model

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-stata:
    runs-on: [self-hosted, windows, stata-runner]   # 确保你的 runner 有这些标签
    env:
      STATA_CMD: ${{ secrets.STATA_CMD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve STATA_CMD (.lnk -> exe) and set env
        shell: powershell
        run: |
          if (-not $env:STATA_CMD -or $env:STATA_CMD -eq '') { Write-Error 'STATA_CMD not set'; exit 1 }
          $path = $env:STATA_CMD.Trim('"')
          if ($path -like '*.lnk') {
            $w = New-Object -ComObject WScript.Shell
            $lnk = $w.CreateShortcut($path)
            $target = $lnk.TargetPath
            if (-not $target) { Write-Error "Failed to resolve .lnk target"; exit 1 }
            Write-Host "Resolved STATA target: $target"
            Add-Content -Path $env:GITHUB_ENV -Value "STATA_RESOLVED=$target"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "STATA_RESOLVED=$path"
          }

      - name: Verify Stata executable exists
        shell: powershell
        run: |
          Write-Host "STATA_RESOLVED=$env:STATA_RESOLVED"
          if (-not (Test-Path $env:STATA_RESOLVED)) { Write-Error "Stata exe not found"; exit 1 }

      - name: Run Stata model (robust)
        shell: powershell
        run: |
          $stata = $env:STATA_RESOLVED.Trim('"')
          $do = "scripts\model.do"           # 如有必要按 repo 路径调整
          $work = $env:GITHUB_WORKSPACE
          Write-Host "Starting Stata: $stata"
          $logstdout = Join-Path $work "stata_stdout.txt"
          $logstderr = Join-Path $work "stata_stderr.txt"

          try {
            $proc = Start-Process -FilePath $stata -ArgumentList ("-b","do",$do) -WorkingDirectory $work -NoNewWindow -RedirectStandardOutput $logstdout -RedirectStandardError $logstderr -PassThru -Wait
            $exit = $proc.ExitCode
          } catch {
            Write-Host "Start-Process failed: $_. Trying direct invocation..."
            & "$stata" -b do "$do"
            $exit = $LASTEXITCODE
          }

          Write-Host "Stata exit code: $exit"
          if (Test-Path $logstdout) { Write-Host "---- STDOUT ----"; Get-Content $logstdout -Raw | Write-Host }
          if (Test-Path $logstderr) { Write-Host "---- STDERR ----"; Get-Content $logstderr -Raw | Write-Host }

          # 打印仓库下的任何 .log（Stata do 脚本通常会生成）
          Get-ChildItem -Path $work -Filter *.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "---- FILE: $($_.FullName) ----"
            Get-Content $_.FullName -Tail 200 | ForEach-Object { Write-Host $_ }
          }

          if ($null -eq $exit) { Write-Error "No exit code. Ensure STATA_CMD points to exe."; exit 1 }
          if ($exit -ne 0) { Write-Error "Stata failed with code $exit"; exit $exit }
          Write-Host "Stata completed OK."

      - name: Upload artifacts (logs & outputs)
        uses: actions/upload-artifact@v4
        with:
          name: stata-results
          path: |
            scripts/**/*.log
            *.log
            stata_stdout.txt
            stata_stderr.txt
            results/**/*   # 如果你有 results 目录保存输出
