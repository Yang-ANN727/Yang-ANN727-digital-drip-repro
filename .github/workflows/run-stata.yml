name: Run Stata model
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-stata:
    runs-on: [self-hosted, windows, stata-runner]   # 确保 runner 有这些标签，或按需修改
    env:
      STATA_CMD: ${{ secrets.STATA_CMD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print runner info
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Labels: $env:RUNNER_LABELS"
          Write-Host "STATA_CMD(secret) = $env:STATA_CMD"

      - name: Resolve STATA_CMD (handle .lnk shortcut)
        shell: powershell
        run: |
          if (-not $env:STATA_CMD -or $env:STATA_CMD -eq '') {
            Write-Error "STATA_CMD is not set. Please add repository secret STATA_CMD with path to Stata executable or .lnk."
            exit 1
          }

          $path = $env:STATA_CMD
          # If user provided a quoted value when creating secret, remove surrounding quotes
          if ($path.StartsWith('"') -and $path.EndsWith('"')) { $path = $path.Trim('"') }

          if ($path -like '*.lnk') {
            Write-Host "STATA_CMD points to a .lnk shortcut. Attempting to resolve..."
            try {
              $w = New-Object -ComObject WScript.Shell
              $lnk = $w.CreateShortcut($path)
              $target = $lnk.TargetPath
            } catch {
              Write-Error "Failed to resolve shortcut: $_"
              exit 1
            }
            if (-not $target) {
              Write-Error "Could not resolve shortcut target. Please set STATA_CMD to the actual exe path."
              exit 1
            }
            Write-Host "Resolved shortcut target: $target"
            Add-Content -Path $env:GITHUB_ENV -Value "STATA_RESOLVED=$target"
          } else {
            Add-Content -Path $env:GITHUB_ENV -Value "STATA_RESOLVED=$path"
          }

      - name: Verify Stata executable exists
        shell: powershell
        run: |
          Write-Host "STATA_RESOLVED=$env:STATA_RESOLVED"
          if (-not (Test-Path $env:STATA_RESOLVED)) {
            Write-Error "Stata executable not found at $env:STATA_RESOLVED"
            exit 1
          }
          Write-Host "Stata executable found."

      - name: Run Stata model (batch)
        shell: powershell
        run: |
          $stata = $env:STATA_RESOLVED
          Write-Host "Starting Stata: $stata"
          # 使用 -b (batch) 运行，注意 scripts\model.do 路径按仓库结构调整
          & "$stata" -b do "scripts\model.do"
          $exit = $LASTEXITCODE
          Write-Host "Stata exited with code $exit"
          if ($exit -ne 0) {
            Write-Error "Stata failed with exit code $exit"
            exit $exit
          }
          Write-Host "Stata run completed successfully."
