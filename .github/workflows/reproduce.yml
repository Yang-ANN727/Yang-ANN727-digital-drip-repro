name: Run Stata Reproduction

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  run-stata:
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Verify required files
        shell: powershell
        run: |
          Write-Host "PWD: $(Get-Location)"
          Get-ChildItem -Force
          if (!(Test-Path "reproduce.do")) { throw "reproduce.do not found" }
          if (!(Test-Path "data.csv")) { throw "data.csv not found" }

      - name: Debug revision and file head
        shell: powershell
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          Write-Host "----- reproduce.do head -----"
          Get-Content .\reproduce.do -TotalCount 80

      - name: Run reproduce.do with StataNow19
        shell: powershell
        run: |
          $exe = "C:\Program Files\StataNow19\StataMP-64.exe"
          if (!(Test-Path $exe)) { throw "Stata exe not found: $exe" }

          if (Test-Path "run.log") { Remove-Item "run.log" -Force }

          & $exe /e do reproduce.do
          Start-Sleep -Seconds 5

          if (!(Test-Path "run.log")) { throw "run.log not generated" }

          $lines = Get-Content "run.log"
          $err = $null
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "r\([0-9]+\);") { $err = $i; break }
          }

          if ($null -ne $err) {
            $start = [Math]::Max(0, $err - 8)
            $end   = [Math]::Min($lines.Count - 1, $err + 4)
            Write-Host "===== First r() context ====="
            for ($j = $start; $j -le $end; $j++) { Write-Host $lines[$j] }
            throw "Stata reported first r() error at line index $err"
          }

          Write-Host "No r() error detected."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stata-output
          path: |
            run.log
            *.log
            *.txt
            *.csv
