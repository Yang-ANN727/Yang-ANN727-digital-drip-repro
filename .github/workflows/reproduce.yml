name: Run Stata Reproduction

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

concurrency:
  group: stata-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-stata:
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Preflight network to GitHub
        shell: powershell
        run: |
          Write-Host "Testing github.com:443 connectivity..."
          $ok = $false
          1..5 | ForEach-Object {
            $t = Test-NetConnection github.com -Port 443 -WarningAction SilentlyContinue
            if ($t.TcpTestSucceeded) { $ok = $true; return }
            Write-Host "Attempt $_ failed, wait 8s..."
            Start-Sleep -Seconds 8
          }
          if (-not $ok) { throw "Network preflight failed: cannot reach github.com:443" }

      - name: Checkout repository (retry by Actions)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Show workspace
        shell: powershell
        run: |
          Write-Host "PWD: $(Get-Location)"
          Get-ChildItem -Force

      - name: Verify required files
        shell: powershell
        run: |
          if (!(Test-Path "reproduce.do")) { throw "reproduce.do not found" }
          if (!(Test-Path "data.dta")) { throw "data.dta not found" }

      - name: Locate Stata executable
        id: locate_stata
        shell: powershell
        run: |
          $stataPaths = @(
            "C:\Program Files\StataNow19\StataMP-64.exe",
            "C:\Program Files\StataNow19\StataSE-64.exe",
            "C:\Program Files\Stata18\StataMP-64.exe",
            "C:\Program Files\Stata18\StataSE-64.exe",
            "C:\Program Files\Stata17\StataMP-64.exe",
            "C:\Program Files\Stata17\StataSE-64.exe",
            "C:\Program Files\Stata16\StataMP-64.exe",
            "C:\Program Files\Stata16\StataSE-64.exe"
          )

          $stataExe = $null
          foreach ($p in $stataPaths) {
            if (Test-Path $p) { $stataExe = $p; break }
          }

          if (-not $stataExe) {
            Write-Host "Checked paths:"
            $stataPaths | ForEach-Object { Write-Host $_ }
            throw "Stata executable not found."
          }

          "stataExe=$stataExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Using Stata at: $stataExe"

      - name: Run do-file and validate run.log
        shell: powershell
        run: |
          if (Test-Path "run.log") { Remove-Item "run.log" -Force }

          & "${{ steps.locate_stata.outputs.stataExe }}" /e do reproduce.do

          Start-Sleep -Seconds 5

          if (!(Test-Path "run.log")) {
            throw "Stata finished but run.log was not generated."
          }

          $logText = Get-Content "run.log" -Raw
          if ($logText -match "r\([0-9]+\);") {
            throw "Stata reported r() error in run.log."
          }

          Write-Host "Stata completed without detected r() error."

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stata-output
          path: |
            run.log
            *.log
            *.txt
            *.csv
            *.xlsx
            *.dta
            _diag/**
            _work/**

      - name: Print tail of run.log on failure
        if: failure()
        shell: powershell
        run: |
          if (Test-Path "run.log") {
            Write-Host "===== run.log (last 120 lines) ====="
            Get-Content "run.log" -Tail 120
          } else {
            Write-Host "run.log not found"
          }
